name: Publish portfolio to GitHub Pages

# Run manually after reviewing and pushing portfolio content.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run from the draft branch must never publish a preview as live.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portfolio/Site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Portfolio/Site
      - name: Build static site
        run: npm run build
        working-directory: Portfolio/Site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Portfolio/Site/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
